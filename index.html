<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teoretika 22114 | Cel Mai Bun Robot din România</title>



    
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #7000ff;
            --dark: #0a0a12;
            --light: #ffffff;
            --gray: #1a1a2e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            overflow-x: hidden;
        }

        /* Header / Navigatie */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: rgba(10, 10, 18, 0.9);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        nav a {
            color: var(--light);
            text-decoration: none;
            margin-left: 20px;
            transition: 0.3s;
            font-weight: 500;
        }

        nav a:hover {
            color: var(--primary);
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: radial-gradient(circle at center, var(--secondary) 0%, var(--dark) 70%);
            position: relative;
        }

        .hero h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .hero h1 span {
            color: var(--primary);
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.6);
        }

        .hero p {
            font-size: 1.5rem;
            color: #b0b0d0;
            max-width: 600px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: all 0.4s ease;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .btn:hover {
            background: var(--primary);
            color: var(--dark);
            box-shadow: 0 0 25px var(--primary);
            transform: translateY(-3px);
        }

        /* Sectiuni */
        section {
            padding: 100px 8%;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 50px;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: var(--primary);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* Specificatii Grid */
        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .spec-card {
            background: var(--gray);
            padding: 30px;
            border-radius: 10px;
            border-left: 4px solid var(--secondary);
            transition: 0.3s;
        }

        .spec-card:hover {
            transform: translateY(-5px);
            border-left-color: var(--primary);
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.1);
        }

        .spec-card h3 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        /* Despre Robot */
        .about-container {
            display: flex;
            align-items: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .about-text {
            flex: 1;
            min-widh: 300px;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #d0d0f0;
        }

        .about-stats {
            flex: 1;
            min-width: 300px;
            background: linear-gradient(135deg, var(--gray), #111125);
            padding: 40px;
            border-radius: 15px;
            border: 1px solid rgba(112, 0, 255, 0.3);
        }

        .stat-item {
            margin-bottom: 20px;
        }

        .stat-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .stat-bar {
            height: 10px;
            background: #252542;
            border-radius: 5px;
            overflow: hidden;
        }
