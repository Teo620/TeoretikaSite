  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('contact-form');
      const status = document.getElementById('form-status');
      const submitBtn = document.getElementById('submit');

      if (!form) return;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const originalBtnValue = submitBtn.value;
        submitBtn.value = 'Sending...';
        submitBtn.disabled = true;

        const data = new FormData(form);

        // Preluăm valoarea câmpului de telefon
const phoneInput = form.querySelector('input[name="Phone"]');
const phoneRegex = /^[0-9]+$/; // Expresie care permite doar cifre

if (!phoneRegex.test(phoneInput.value.trim())) {
  status.innerText = 'Te rugăm să introduci un număr de telefon valid (doar cifre).';
  status.classList.add('error');
  submitBtn.value = originalBtnValue;
  submitBtn.disabled = false;
  return; // Oprește trimiterea
}

        try {
          const response = await fetch(form.action, {
            method: form.method,
            body: data,
            headers: {
              'Accept': 'application/json'
            }
          });

          if (response.ok) {
            status.innerText = 'Message sent successfully!';
            status.style.color = '#4CAF50';
            status.style.display = 'block';
            form.reset();
          } else {
            const responseData = await response.json();
            if (Object.hasOwn(responseData, 'errors')) {
              status.innerText = responseData.errors.map(error => error["message"]).join(", ");
              
            } else {
              status.innerText = 'Oops! There was a problem submitting your form.';
            }
            status.style.color = '#f44336';
            status.style.display = 'block';
            status.style.textShadow = '-1px -1px 0 #E0998B, 1px -1px 0 #E0998B, -1px 1px 0 #E0998B, 1px 1px 0 #E0998B';
          }
        } catch (error) {
          status.innerText = 'Oops! There was a network problem.';
          status.style.color = '#f44336';
          status.style.display = 'block';
          
        } finally {
          submitBtn.value = originalBtnValue;
          submitBtn.disabled = false;
        }
      });
    });
  </script>
